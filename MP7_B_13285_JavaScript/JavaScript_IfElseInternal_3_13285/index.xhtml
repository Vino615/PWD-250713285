<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>If-Else Internal: Ongkos Kirim</title>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	<script type="text/javascript">
        var iBerat;
        var sEkspres;

        iBerat = prompt("Masukkan berat paket (kg).", 0);
        sEkspres = prompt("Pakai pengiriman ekspres? (Y)a atau (T)idak", "T");

        if(iBerat > 5){
            if(sEkspres == "Y"){
                alert("Ongkir Rp50.000 (ekspres)");
            }else{
                alert("Ongkir Rp30.000 (reguler)");
            }
        }else{
            if(sEkspres == "Y"){
                alert("Ongkir Rp25.000 (Ekspres)");
            }else{
                alert("Ongkir Rp12.000 (reguler)");
            }
        }
    </script>
	
</head>
<body>
    <h1>If-Else Internal: Ongkor Kirim</h1>
    <p>Reload Halaman untuk mencoba lagi</p>
</body>
</html>
